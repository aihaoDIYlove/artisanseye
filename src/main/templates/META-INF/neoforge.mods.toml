
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

logoFile="logo.png"

authors="aihaoDIYlove"

description='''
A helper mod for TerraFirmaCraft, mainly used to improve the ore prospecting and forging experience.
'''

[[mixins]]
config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tfc"
    type="required"
    versionRange="${tfc_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="patchouli"
    type="required"
    versionRange="${patchouli_version_range}"
    ordering="AFTER"
    side="CLIENT"

# Precision Prospecting 可选前置：兼容其 ProspectorItem 勘矿镐（见 PrecProsCompat），参数经 2.1 源码核实
[[dependencies.${mod_id}]]
    modId="precisionprospecting"
    type="optional"
    versionRange="[2.1,3)"
    ordering="AFTER"
    side="CLIENT"
